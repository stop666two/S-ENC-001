[package]
name = "s-enc-core"
version = "1.0.0"
edition = "2021"
description = "S-ENC-001 core WASM module - encryption, decryption, hashing"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.127"
js-sys = "0.3.104"
getrandom = { version = "0.2.17", features = ["js"] }
aes-gcm = "0.10.3"
argon2 = "0.5.3"
hkdf = "0.12.4"
sha2 = "0.10.9"
hmac = "0.12.1"
zstd = { version = "0.13.3", features = ["no_asm"] }
rand = "0.8.7"
zeroize = { version = "1.9.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.22.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
